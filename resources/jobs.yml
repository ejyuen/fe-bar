resources:
  jobs:
    setup_job:
      name: matter-intelligence-setup
      max_concurrent_runs: 1
      tasks:
        - task_key: download_cuad
          environment_key: default
          spark_python_task:
            python_file: ../src/setup/00_download_cuad.py
            parameters: ["--catalog", "${var.catalog}", "--doc_limit", "${var.doc_limit}"]
        - task_key: generate_synthetic
          depends_on: [{task_key: download_cuad}]
          environment_key: default
          spark_python_task:
            python_file: ../src/setup/01_generate_synthetic.py
            parameters: ["--catalog", "${var.catalog}"]
        - task_key: uc_governance_pre
          depends_on: [{task_key: generate_synthetic}]
          environment_key: default
          spark_python_task:
            python_file: ../src/setup/run_sql_file.py
            parameters: ["--catalog", "${var.catalog}", "--file", "${workspace.file_path}/src/setup/02_uc_governance.sql", "--section", "pre"]
        - task_key: run_pipeline
          depends_on: [{task_key: uc_governance_pre}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.matter_pipeline.id}
            full_refresh: false
        - task_key: uc_governance_post
          depends_on: [{task_key: run_pipeline}]
          environment_key: default
          spark_python_task:
            python_file: ../src/setup/run_sql_file.py
            parameters: ["--catalog", "${var.catalog}", "--file", "${workspace.file_path}/src/setup/02_uc_governance.sql", "--section", "post"]
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - faker==37.4.0

    eval_job:
      name: matter-intelligence-eval
      max_concurrent_runs: 1
      tasks:
        - task_key: build_eval_set
          environment_key: eval
          spark_python_task:
            python_file: ../src/eval/build_eval_set.py
            parameters: ["--catalog", "${var.catalog}", "--warehouse_id", "${var.warehouse_id}",
                         "--src_dir", "${workspace.file_path}/src/eval"]
        - task_key: run_eval
          depends_on: [{task_key: build_eval_set}]
          environment_key: eval
          spark_python_task:
            python_file: ../src/eval/run_eval.py
            parameters: ["--catalog", "${var.catalog}", "--warehouse_id", "${var.warehouse_id}",
                         "--src_dir", "${workspace.file_path}/src/eval",
                         "--experiment", "/Users/${workspace.current_user.userName}/matter-intelligence-eval"]
      environments:
        - environment_key: eval
          spec:
            environment_version: "4"
            dependencies:
              - mlflow[databricks]>=3.5,<4
              - rapidfuzz>=3.9
              - databricks-sdk>=0.67

    lakebase_job:
      name: matter-intelligence-lakebase-setup
      max_concurrent_runs: 1
      tasks:
        - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.matter_pipeline.id}
        - task_key: setup_synced_tables
          depends_on: [{task_key: refresh_pipeline}]
          environment_key: lakebase
          spark_python_task:
            python_file: ../src/lakebase/setup_synced_tables.py
            parameters: ["--catalog", "${var.catalog}", "--instance", "${var.lakebase_instance}",
                         "--app_name", "${resources.apps.matter_app.name}", "--src_dir", "${workspace.file_path}/src"]
      environments:
        - environment_key: lakebase
          spec:
            environment_version: "4"
            dependencies: ["psycopg[binary]>=3.2", "databricks-sdk>=0.67"]

    sync_job:
      name: matter-intelligence-sync-reviews
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
      tasks:
        - task_key: sync_reviews_back
          environment_key: lakebase
          spark_python_task:
            python_file: ../src/lakebase/sync_reviews_back.py
            parameters: ["--catalog", "${var.catalog}", "--instance", "${var.lakebase_instance}",
                         "--src_dir", "${workspace.file_path}/src"]
      environments:
        - environment_key: lakebase
          spec:
            environment_version: "4"
            dependencies: ["psycopg[binary]>=3.2", "databricks-sdk>=0.67"]

    roundtrip_job:
      name: matter-intelligence-review-roundtrip
      max_concurrent_runs: 1
      tasks:
        - task_key: roundtrip_override
          environment_key: lakebase
          spark_python_task:
            python_file: ../src/lakebase/roundtrip_demo.py
            parameters: ["--catalog", "${var.catalog}", "--instance", "${var.lakebase_instance}",
                         "--src_dir", "${workspace.file_path}/src"]
        - task_key: sync_reviews_back
          depends_on: [{task_key: roundtrip_override}]
          environment_key: lakebase
          spark_python_task:
            python_file: ../src/lakebase/sync_reviews_back.py
            parameters: ["--catalog", "${var.catalog}", "--instance", "${var.lakebase_instance}",
                         "--src_dir", "${workspace.file_path}/src"]
      environments:
        - environment_key: lakebase
          spec:
            environment_version: "4"
            dependencies: ["psycopg[binary]>=3.2", "databricks-sdk>=0.67"]

    override_demo_job:
      name: matter-intelligence-genie-override-demo
      description: Demo step 4/5 - reviewer overrides uncapped liability on the auto-renewing license; synced back so Genie reflects it
      max_concurrent_runs: 1
      tasks:
        - task_key: override_uncapped_liability
          environment_key: lakebase
          spark_python_task:
            python_file: ../src/lakebase/roundtrip_demo.py
            parameters: ["--catalog", "${var.catalog}", "--instance", "${var.lakebase_instance}",
                         "--src_dir", "${workspace.file_path}/src", "--clause_type", "uncapped_liability",
                         "--doc_title_like", "%JOINT CONTENT LICENSE%", "--new_value", "false",
                         "--comment", "Carve-outs are subject to the aggregate cap per side letter; liability is capped",
                         "--skip_latency"]
        - task_key: sync_reviews_back
          depends_on: [{task_key: override_uncapped_liability}]
          environment_key: lakebase
          spark_python_task:
            python_file: ../src/lakebase/sync_reviews_back.py
            parameters: ["--catalog", "${var.catalog}", "--instance", "${var.lakebase_instance}",
                         "--src_dir", "${workspace.file_path}/src"]
      environments:
        - environment_key: lakebase
          spec:
            environment_version: "4"
            dependencies: ["psycopg[binary]>=3.2", "databricks-sdk>=0.67"]
